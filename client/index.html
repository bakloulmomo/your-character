<!DOCTYPE html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon_logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08080B" />

    <title>your-character - Home</title>
    <!-- La descrizione precedente («minimale, ad alte prestazioni ed elevata
         densità informativa») non diceva che cosa fa il prodotto: erano
         aggettivi sull'implementazione, non una frase per chi cerca. -->
    <meta name="description" content="Crea un personaggio, dagli una personalità e conversaci. Le tue conversazioni restano tue." />

    <!-- Anteprima dei link condivisi.
         Il prodotto ha un pulsante «Condividi» su ogni scheda personaggio: senza
         queste righe l'indirizzo incollato in una chat compariva come un URL
         nudo, senza titolo né immagine. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="your-character" />
    <meta property="og:title" content="your-character" />
    <meta property="og:description" content="Crea un personaggio, dagli una personalità e conversaci." />
    <meta property="og:image" content="/favicon_logo.jpeg" />
    <meta name="twitter:card" content="summary" />

    <!-- DUE CARATTERI, DUE MESTIERI.

         Archivo è l'INSEGNA: nomi di personaggi, titoli, il vertice della
         pagina. Ha l'asse di LARGHEZZA variabile (`wdth`), quindi la
         compressione tipografica è un'impostazione e non un secondo file da
         scaricare — ed è il motivo per cui non serve né Bebas né Oswald, che
         sono il primo risultato di qualunque generatore e si riconoscono a
         distanza.

         Schibsted Grotesk è l'ATTREZZATURA: pulsanti, campi, etichette,
         metadati, e la prosa delle conversazioni. Resta da «Rivista», dove era
         già la scelta giusta. Inter e Outfit erano la coppia predefinita di
         ogni generatore: corrette, e identiche a quelle di chiunque altro.

         Newsreader è uscito con il serif: era la voce di «Rivista», la voce di
         «Notturno» è la locandina. Due famiglie prima, due dopo — il costo di
         caricamento non cambia. `display=swap` e il precaricamento evitano che
         il testo resti invisibile mentre arrivano. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
